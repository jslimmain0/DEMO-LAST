# 공통 ORM·웹 설정만 core에서 가져온다. 연결과 호스트 설정은 중앙 서버 소유다.
spring:
  config:
    import: classpath:application-core.yml
  profiles:
    default: local
flowlink:
  auth:
    github-enabled: ${FLOWLINK_AUTH_GITHUB_ENABLED:false}
  runtime:
    public-url: ${FLOWLINK_PUBLIC_URL:}
server:
  port: ${FLOWLINK_PORT:18080}
  servlet:
    context-path: ${FLOWLINK_CONTEXT_PATH:}
