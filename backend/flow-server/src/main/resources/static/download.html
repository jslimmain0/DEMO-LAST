</div></main><script>
  const element = id => document.getElementById(id);
  async function load() {
    element('download').hidden = true; element('download').removeAttribute('href'); element('retry').hidden = true;
    element('compatibility').hidden = true; element('version').textContent = ''; element('server-version').textContent = '';
    element('status').textContent = '최신 버전을 확인하는 중…';
    try {
      const response = await fetch(new URL('api/v1/distribution', document.baseURI), { credentials: 'omit', cache: 'no-store', signal: AbortSignal.timeout(15000) });
      if (!response.ok) throw new Error('distribution');
      const info = await response.json();
      element('server-version').textContent = info.serverVersion ? '서버 버전 ' + info.serverVersion : '';
      const release = info.available && info.release;
      if (!release || !/^\d+\.\d+\.\d+$/.test(release.version)) {
        element('status').textContent = '설치 파일이 아직 준비되지 않았습니다. 서버 관리자에게 배포를 요청하세요.';
        element('retry').hidden = false; return;
      }
      element('download').href = new URL('downloads/FlowLink-' + release.version + '-windows-x64.msi', document.baseURI).href;
      element('download').hidden = false; element('status').textContent = '최신 버전이 준비되어 있습니다.';
      element('version').textContent = '버전 ' + release.version + ' · ' + (release.size / 1024 / 1024).toFixed(1) + ' MB';
      element('compatibility').hidden = info.releaseStatus !== 'INCOMPATIBLE';
    } catch { element('status').textContent = '서버의 배포 정보를 확인하지 못했습니다. 다시 확인하거나 서버 관리자에게 문의하세요.'; element('retry').hidden = false; }
  }
  element('retry').addEventListener('click', load); load();
</script></body></html>
