spring:
  application:
    name: flowlink
  datasource:
    url: ${FLOWLINK_DB_URL:jdbc:postgresql://localhost:5432/flowlink}
    username: ${FLOWLINK_DB_USER:flowlink}
    password: ${FLOWLINK_DB_PASSWORD:flowlink}
    hikari:
      maximum-pool-size: 10
      pool-name: flowlink-pool
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마 소유권은 Flyway. JPA는 검증만.
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    # vendor 별 마이그레이션 디렉터리 — PG=postgresql/(기존 V1~V8 이동), Oracle=oracle/(통합 V1)
    locations: classpath:db/migration/{vendor}
  mvc:
    servlet:
      load-on-startup: 1        # 시작 시 DispatcherServlet 초기화(첫 요청 지연/레이스 방지)
  servlet:
    multipart:
      max-file-size: 20MB       # 플러그인 JAR 업로드용
      max-request-size: 20MB

server:
  port: ${FLOWLINK_PORT:18080}
  shutdown: graceful           # 실행 중 워크플로 안전 종료 대비

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: flowlink

# Flowlink 고유 설정
flowlink:
  execution:
    http:
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
      max-response-bytes: 5242880        # 5MB 초과 응답은 거절
    ssrf:
      enabled: true
      block-private-networks: true       # RFC1918/loopback/link-local 차단
      allow-loopback: false              # 로컬 배포 시 true → localhost/127.0.0.1/::1 허용(사설망은 여전히 차단). h2 프로파일은 true
      blocked-hosts:                     # 클라우드 메타데이터 등 명시 차단
        - 169.254.169.254
        - metadata.google.internal
      allowed-schemes:
        - http
        - https
    capture:
      request-response-bodies: false     # redaction deny-by-default. true 로 켜면 HTTP req/res 본문 저장(디버그용). h2 프로파일은 true
    max-nodes-per-run: 200               # 폭주 방지
    relay:
      # wait 콜백 수신 URL base — {base}/relay/{execId}/cb/{nodeId} (백엔드가 직접 수신·재개).
      # 미설정 시: 화면 설정(설정 다이얼로그)에 저장한 값 → 접속한 주소(오리진) 자동 순으로 결정(RelayBaseResolver).
      # env FLOWLINK_EXECUTION_RELAY_BASEURL 또는 아래 값으로 명시하면 자동보다 우선한다.
      base-url: ${FLOWLINK_EXECUTION_RELAY_BASEURL:}
  # 보안 (IdP 비종속). issuer-uri 미설정 시 dev permitAll 로 동작.
  security:
    tenant-claim: tenant                 # JWT 에서 테넌트(팀) 식별자를 읽을 클레임 이름
    client-id: flowlink-web              # 프론트(SPA)용 OIDC public 클라이언트 id — /api/v1/auth/config 로 노출
    # cors-origins:                      # /api/** CORS 허용 오리진(미설정 시 localhost 5173/3000/18080)
    #   - https://flowlink.example.com

# 운영 전환 시 아래 주석을 풀어 OIDC 리소스 서버 + RBAC(admin/editor/viewer/platform-admin) 활성화.
# issuer-uri 는 브라우저가 보는 주소(토큰 iss 와 일치해야 함), 컨테이너에서 IdP 도달 주소가 다르면 jwk-set-uri 를 별도 지정:
# spring:
#   security:
#     oauth2:
#       resourceserver:
#         jwt:
#           issuer-uri: http://localhost:8081/realms/flowlink
#           # jwk-set-uri: http://keycloak:8080/realms/flowlink/protocol/openid-connect/certs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
