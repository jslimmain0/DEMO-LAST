spring:
  application:
    name: flowlink
  # 기본 DB = Oracle. 로컬 개발은 h2 프로파일(application-h2.yml, scripts 기본)로 오버라이드.
  # 사내/별도 서버 Oracle 로는 FLOWLINK_DB_URL 만 그쪽으로 바꾸면 된다(스키마는 Flyway 가 생성).
  datasource:
    url: ${FLOWLINK_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${FLOWLINK_DB_USER:flowlink}
    password: ${FLOWLINK_DB_PASSWORD:flowlink}
    hikari:
      maximum-pool-size: 10
      pool-name: flowlink-pool
  jpa:
    hibernate:
      # Oracle: 엔티티 columnDefinition="text"(PG 문법) 12곳이 validate 와 충돌 → Flyway 가 스키마 단독 소유.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
      hibernate.type.preferred_uuid_jdbc_type: CHAR   # uuid → varchar2(36) 문자열 바인딩
  flyway:
    enabled: true
    baseline-on-migrate: true
    # vendor 별 마이그레이션 디렉터리 — Oracle=oracle/(통합 V1 + V9~). h2 프로파일은 flyway off.
    locations: classpath:db/migration/{vendor}
  mvc:
    servlet:
      load-on-startup: 1        # 시작 시 DispatcherServlet 초기화(첫 요청 지연/레이스 방지)
  servlet:
    multipart:
      max-file-size: 20MB       # 플러그인 JAR 업로드용
      max-request-size: 20MB

server:
  port: ${FLOWLINK_PORT:18080}
  shutdown: graceful           # 실행 중 워크플로 안전 종료 대비

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: flowlink

# Flowlink 고유 설정
flowlink:
  execution:
    http:
      connect-timeout-ms: 5000
      read-timeout-ms: 30000
      max-response-bytes: 5242880        # 5MB 초과 응답은 거절
    ssrf:
      enabled: true
      block-private-networks: true       # RFC1918/loopback/link-local 차단
      allow-loopback: true               # 앱이 자기 내장 mock(/mock/**)을 localhost 로 호출 → 허용(사설망은 여전히 차단). h2 프로파일은 ssrf 전체 off
      blocked-hosts:                     # 클라우드 메타데이터 등 명시 차단
        - 169.254.169.254
        - metadata.google.internal
      allowed-schemes:
        - http
        - https
    capture:
      request-response-bodies: false     # redaction deny-by-default. true 로 켜면 HTTP req/res 본문 저장(디버그용). h2 프로파일은 true
    max-nodes-per-run: 200               # 폭주 방지
    relay:
      # wait 콜백 수신 URL base — {base}/relay/{execId}/cb/{nodeId} (백엔드가 직접 수신·재개).
      # 미설정 시: 화면 설정(설정 다이얼로그)에 저장한 값 → 접속한 주소(오리진) 자동 순으로 결정(RelayBaseResolver).
      # env FLOWLINK_EXECUTION_RELAY_BASEURL 또는 아래 값으로 명시하면 자동보다 우선한다.
      base-url: ${FLOWLINK_EXECUTION_RELAY_BASEURL:}
  # AI 어시스턴트(자연어 → 플로우). api-key 없으면 stub 모드(샘플 그래프)로 동작.
  # 키는 여기(env) 또는 시크릿 볼트의 `anthropic-api-key` 로 설정.
  assistant:
    api-key: ${FLOWLINK_ASSISTANT_API_KEY:}          # 비면 시크릿 볼트 → 둘 다 없으면 stub
    model: ${FLOWLINK_ASSISTANT_MODEL:claude-sonnet-5}
    base-url: ${FLOWLINK_ASSISTANT_BASE_URL:https://api.anthropic.com}
    max-tokens: ${FLOWLINK_ASSISTANT_MAX_TOKENS:4096}
  # HashiCorp Vault(KV v2) 연동 — enabled=true 면 Vault 시크릿을 시크릿 볼트에 오버레이(공통 기본층, DB 가 덮어씀).
  # infra 도커의 Vault dev 서버(infra/docker-compose.yml)에 붙거나, 운영 Vault 로 env 를 바꾼다. 미설정이면 완전 비활성.
  #   FLOWLINK_VAULT_ENABLED=true  FLOWLINK_VAULT_ADDRESS=http://localhost:8200  FLOWLINK_VAULT_TOKEN=<토큰>
  vault:
    enabled: ${FLOWLINK_VAULT_ENABLED:false}
    address: ${FLOWLINK_VAULT_ADDRESS:http://localhost:8200}
    token: ${FLOWLINK_VAULT_TOKEN:}                   # dev 루트 토큰 또는 AppRole 발급 토큰. 미설정이면 비활성
    mount: ${FLOWLINK_VAULT_MOUNT:secret}             # KV v2 마운트
    path: ${FLOWLINK_VAULT_PATH:flowlink}             # 워크플로 시크릿({{ 이름@secret }}): GET secret/data/flowlink
    # 앱 설정 비밀(jwt-secret 등) 전용 경로 — 워크플로에 노출 안 됨. 운영 jwt-secret 은 여기 key=jwt-secret 로 둔다:
    #   vault kv put secret/flowlink-config jwt-secret=<강한 시크릿>
    config-path: ${FLOWLINK_VAULT_CONFIG_PATH:flowlink-config}   # GET secret/data/flowlink-config
    refresh-seconds: ${FLOWLINK_VAULT_REFRESH_SECONDS:60}
  # 보안 (IdP 비종속). 아무 인증도 활성 안 하면 dev permitAll(로컬).
  security:
    tenant-claim: tenant                 # JWT 에서 테넌트(팀) 식별자를 읽을 클레임 이름
    # cors-origins:                      # /api/** CORS 허용 오리진(미설정 시 localhost 5173/3000/18080)
    #   - https://flowlink.example.com
  # 앱 인증 — GitHub 로그인(Copilot 과 동일한 디바이스 플로우). 로그인하면 앱이 자체 JWT(HMAC)를 발급하고,
  # 그 JWT 를 리소스 서버로 검증 → 인증 필수 + RBAC + 테넌트 격리(Keycloak 없이 동작). 미설정이면 dev permitAll.
  # ⚠ github-enabled=true 면 서명 시크릿 **필수**(없으면 토큰 위조 가능 → 기동 실패). allowed-logins 는 선택.
  #   서명 시크릿: **로컬은 env FLOWLINK_AUTH_JWT_SECRET, 운영은 Vault**(flowlink-config 경로 key=jwt-secret) — env 우선, 없으면 Vault.
  # 운영(EC2)에선 env 로 켠다:
  #   FLOWLINK_AUTH_GITHUB_ENABLED=true
  #   FLOWLINK_AUTH_JWT_SECRET=<강한 시크릿>            # 로컬. 운영은 이걸 비우고 Vault(flowlink-config/jwt-secret)에서 끌어옴
  #   FLOWLINK_AUTH_ALLOWED_LOGINS=alice,bob            # 선택. 허용 GitHub 로그인 화이트리스트 — 비우면 전체 허용(WARN)
  auth:
    github-enabled: ${FLOWLINK_AUTH_GITHUB_ENABLED:false}
    jwt-secret: ${FLOWLINK_AUTH_JWT_SECRET:}
    token-ttl-hours: ${FLOWLINK_AUTH_TOKEN_TTL_HOURS:12}
    # allowed-logins:                    # 비면 GitHub 인증한 누구나(dev). 운영은 화이트리스트 권장.
    #   - your-github-login

# (대안) 표준 OIDC(Keycloak/Auth0/Entra 등)도 여전히 지원 — 아래 issuer-uri 를 설정하면
# GitHub 로그인 대신 OIDC 리소스 서버로 동작한다(코드는 IdP 비종속, JwtDecoder 빈 유무로 자동 전환):
# spring:
#   security:
#     oauth2:
#       resourceserver:
#         jwt:
#           issuer-uri: https://your-idp/realms/flowlink

# 로깅 — 기본 INFO. 상세 추적이 필요하면 FLOWLINK_LOG_LEVEL=DEBUG 로 띄운다
# (노드별 실행 시작/완료·그래프 위상정렬·접근 로그의 GET 요청까지 보인다).
#   요약: 기동 시 StartupSummaryLogger 가 "무엇을 물고 올라왔는지"(DB·인증·Vault·실행 정책·Mock/트리거)를 한 블록으로 남긴다.
logging:
  level:
    root: INFO
    com.flowlink: ${FLOWLINK_LOG_LEVEL:INFO}
    # 아웃바운드 HTTP 와이어 로그가 필요할 때만(요청/응답 헤더까지 — 시크릿 노출 주의)
    org.springframework.web.client.RestTemplate: WARN
  pattern:
    # 요청(r:xxx)/워크플로 실행(x:xxxxxxxx) 상관관계 키 — 한 요청·한 실행이 남긴 줄을 grep 으로 모을 수 있다.
    correlation: "%X{reqId:-}%X{execId:-} "
  file:
    # 파일 로그는 선택 — FLOWLINK_LOG_FILE=/var/log/flowlink/app.log 처럼 주면 켜진다(미설정이면 콘솔만).
    name: ${FLOWLINK_LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: ${FLOWLINK_LOG_MAX_SIZE:50MB}
      max-history: ${FLOWLINK_LOG_MAX_HISTORY:14}
      total-size-cap: ${FLOWLINK_LOG_TOTAL_CAP:2GB}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
