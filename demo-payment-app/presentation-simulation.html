 http:{d:'M710 135 H975',label:'HTTP',x:840,y:123},httpReturn:{d:'M975 180 H710'},
 tcp:{d:'M710 160 H835 Q855 160 855 180 V400 Q855 420 875 420 H975',label:'TCP',x:900,y:406},tcpReturn:{d:'M975 460 H800 V195 H710'}
};
const ns='http://www.w3.org/2000/svg',svg=document.getElementById('diagram'),q=id=>document.getElementById(id);
let index=0,automatic=false,timer=null,frame=null;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const jobLabels={idle:'미준비',working:'AI 생성 중',ready:'준비 완료',failed:'연동 실패'};
function el(tag,attrs,parent=svg){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e;}
function text(value,x,y,cls,parent=svg){const t=el('text',{x,y,class:cls},parent);t.textContent=value;return t;}
function diagram(scene){
 cancelAnimationFrame(frame);svg.querySelectorAll('g,defs,circle').forEach(e=>e.remove());q('diagram-desc').textContent=scene.description+' '+scene.steps.join(' → ');
 const defs=el('defs',{});for(const[name,color]of [['blue','var(--blue)'],['green','var(--green)'],['red','var(--red)']]){const m=el('marker',{id:'arrow-'+name,markerWidth:8,markerHeight:8,refX:7,refY:4,orient:'auto'},defs);el('path',{d:'M1 1 L7 4 L1 7',fill:'none',stroke:color,'stroke-width':1.5},m);}
 const lines=el('g',{}),packets=[];
 for(const key of ['merchantApi','merchantFront','frontApi','callback','http','tcp']){const edge=edgeDefs[key];el('path',{d:edge.d,class:'edge'},lines);if(edge.label&&!scene.edges.includes(key)){const t=text(edge.label,edge.x,edge.y,'edge-label',lines);t.setAttribute('text-anchor','middle');}}
 for(const key of scene.edges){const edge=edgeDefs[key],bad=scene.fail===key,kind=bad?'red':edge.callback?'green':'blue';const p=el('path',{d:edge.d,class:'edge active-edge'+(bad?' failure-edge':edge.callback?' callback-edge':''),'marker-end':`url(#arrow-${kind})`},lines);packets.push({p,kind});if(edge.label){const t=text(edge.label,edge.x,edge.y,'edge-label',lines);t.setAttribute('text-anchor','middle');}}
 const layer=el('g',{});
 for(const n of nodeDefs){
  const active=scene.active.includes(n.id),job=n.id==='http'?scene.jobs[0]:n.id==='tcp'?scene.jobs[2]:null;
  const fill=n.id==='merchant'?'#172c45':job==='ready'?'#eaf6f2':job==='failed'?'#fff0f2':job==='working'?'#fff6e8':active?'#edf2ff':'#f6f8fc';
  const border=job==='failed'?'var(--red)':job==='working'?'#d89b38':job==='ready'?'#8fbeb4':active?'#9fb7ef':'#d9e1ee';
  const group=el('g',{'data-node':n.id},layer);el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:12,fill,stroke:border,'stroke-width':active?2:1},group);
  const title=text(n.title,n.x+20,n.y+36,'node-title',group);if(n.id==='merchant')title.style.fill='white';
  n.sub.forEach((v,i)=>{const t=text(v,n.x+20,n.y+69+i*25,'node-sub',group);if(n.id==='merchant')t.style.fill='#d4e1f2';});
  if(job){const t=text(jobLabels[job],n.x+20,n.y+n.h-17,'node-status',group);t.style.fill=job==='ready'?'var(--green)':job==='failed'?'var(--red)':job==='working'?'var(--amber)':'var(--muted)';}
  else{const t=text(n.tag,n.x+20,n.y+n.h-16,'node-tag',group);if(n.id==='merchant')t.style.fill='#bdcde2';}
 }
 if(!reduced&&packets.length){const dot=el('circle',{r:5,class:'packet'});let start;
  function tick(now){start??=now;const progress=(now-start)/650;const k=Math.floor(progress);if(k>=packets.length){dot.remove();return;}const {p,kind}=packets[k],point=p.getPointAtLength((progress-k)*p.getTotalLength());dot.setAttribute('cx',point.x);dot.setAttribute('cy',point.y);dot.setAttribute('class','packet'+(kind==='red'?' packet-failure':kind==='green'?' packet-callback':''));frame=requestAnimationFrame(tick);}frame=requestAnimationFrame(tick);
 }
}
function schedule(){clearTimeout(timer);if(automatic)timer=setTimeout(()=>index<scenes.length-1?select(index+1):setAuto(false),10000);}
function setAuto(value){automatic=value;q('play').textContent=value?'일시정지':'자동 재생';q('play').setAttribute('aria-pressed',String(value));schedule();}
function select(value){index=Math.max(0,Math.min(scenes.length-1,value));const s=scenes[index];q('chapter').textContent=s.phase;q('title').textContent=s.title;q('description').textContent=s.description;q('count').textContent=String(index+1).padStart(2,'0');q('cue-title').textContent=s.cue;q('cue-detail').textContent=s.detail;q('stage-caption').textContent=s.caption;q('prev').disabled=index===0;q('next').disabled=index===scenes.length-1;
 ['http-job','screen-job','tcp-job'].forEach((id,i)=>{q(id).dataset.state=s.jobs[i];q(id).querySelector('.job-state').textContent=jobLabels[s.jobs[i]];});
 q('mobile-flow').replaceChildren();s.steps.forEach((v,i)=>{if(i){const a=document.createElement('span');a.className='flow-arrow';a.textContent='→';q('mobile-flow').append(a);}const step=document.createElement('span');step.className='flow-step';step.textContent=v;q('mobile-flow').append(step);});
 [...q('timeline').children].forEach((b,i)=>{b.setAttribute('aria-current',i===index?'step':'false');b.classList.toggle('done',i<index);});q('announcement').textContent=`${index+1} / ${scenes.length}. ${s.title}`;diagram(s);schedule();
}
scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='scene-button';b.setAttribute('aria-label',`${i+1}장면: ${s.title}`);const num=document.createElement('b');num.textContent=String(i+1).padStart(2,'0');b.append(num,document.createTextNode(s.short));b.onclick=()=>{setAuto(false);select(i)};q('timeline').append(b);});
q('prev').onclick=()=>{setAuto(false);select(index-1)};q('next').onclick=()=>{setAuto(false);select(index+1)};q('play').onclick=()=>{if(!automatic&&index===scenes.length-1)select(0);setAuto(!automatic)};
q('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{q('announcement').textContent='브라우저 전체 화면 기능을 사용하세요.'}};
document.addEventListener('fullscreenchange',()=>q('full').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면');
document.addEventListener('keydown',e=>{if(e.target.closest('button,input,select,textarea,a'))return;if(e.code==='Space'){e.preventDefault();q('play').click()}if(e.code==='ArrowRight'){e.preventDefault();q('next').click()}if(e.code==='ArrowLeft'){e.preventDefault();q('prev').click()}if(e.key.toLowerCase()==='f')q('full').click()});
window.presentationSimulation={select,getScene:()=>index,scenes};select(0);
})();
</script>
