# FlowLink 풀스택 — 앱(Oracle 프로파일) + Oracle Free 23ai + Keycloak(OIDC).
#   빌드:  (frontend) npm run build  →  (backend) gradlew bootJar  →  docker compose -f deploy/docker-compose.yml up -d --build
#   접속:  http://localhost:18080 (테스트 유저 비번=아이디: alice/bob/carol/dave)
#   초기화: docker compose -f deploy/docker-compose.yml down -v
name: flowlink

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: flowlink-oracle
    environment:
      ORACLE_PASSWORD: admin
      APP_USER: flowlink
      APP_USER_PASSWORD: flowlink
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: flowlink-kc
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # 브라우저가 보는 Keycloak 공개 주소 — 기본 localhost, 공유 서버는 .env 로 오버라이드
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # realm import 의 redirectUris 치환값(Keycloak ${VAR:default} 치환) — 브라우저가 접속하는 오리진
      FLOWLINK_APP_ORIGIN: ${FLOWLINK_APP_ORIGIN:-http://localhost:18080}
      FLOWLINK_WEB_ORIGIN: ${FLOWLINK_WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # KC 25+ 는 curl 미포함 — TCP 오픈만 확인
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 40

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: flowlink-app
    ports:
      - "18080:18080"
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      FLOWLINK_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      FLOWLINK_DB_USER: flowlink
      FLOWLINK_DB_PASSWORD: flowlink
      # issuer 는 토큰 iss 검증(브라우저 관점 주소=KC_PUBLIC_URL 과 일치), JWKS 는 컨테이너 내부 도달 주소로 분리
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KC_PUBLIC_URL:-http://localhost:8081}/realms/flowlink
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/flowlink/protocol/openid-connect/certs
      # 프론트가 SPA 셸을 여는 오리진(CORS) — 단일 jar 동일 오리진이라 기본은 앱 자신
      FLOWLINK_SECURITY_CORS_ORIGINS: ${FLOWLINK_APP_ORIGIN:-http://localhost:18080}
      # RunState 스냅샷(AES-GCM) 암호키 — 운영에선 반드시 교체(.env)
      FLOWLINK_EXECUTION_STATE_SECRET: ${FLOWLINK_STATE_SECRET:-compose-dev-state-secret-change-me}
    depends_on:
      oracle:
        condition: service_healthy
      keycloak:
        condition: service_healthy   # realm import 완료(HTTP 리슨) 후 기동 — 첫 접속 SSO 리다이렉트가 바로 되게

volumes:
  oracle-data:
