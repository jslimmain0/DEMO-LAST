# Keycloak 개발용 단독 기동 — realm(flowlink)·롤·테스트 유저 자동 import.
#   docker compose -f deploy/keycloak-dev.compose.yml up -d
# 백엔드는 아래 env 로 기동하면 OIDC+RBAC 모드:
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8081/realms/flowlink
# 테스트 유저(비번=아이디): alice(team-a admin+platform-admin) / bob(team-a editor) / carol(team-a viewer) / dave(team-b editor)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: flowlink-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # KC 25+ 는 curl 미포함 — 관리포트(9000) health 를 자바로 확인하는 대신 TCP 오픈만 본다
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 40
