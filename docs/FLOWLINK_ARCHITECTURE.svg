<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1190" viewBox="0 0 1740 1190" role="img" aria-labelledby="title desc">
<title id="title">FlowLink 확정 아키텍처: 개인 PC와 중앙 서버</title>
<desc id="desc">Windows 앱에서 한 번 로그인하면 중앙 서버가 GitHub 인증 후 FlowLink MCP용 토큰을 발급한다. desktop이 IDE 사용자 설정의 MCP 주소와 Authorization Bearer 토큰을 자동 반영하고 만료·재발급을 관리한다. IDE는 별도 OAuth 로그인 없이 중앙 MCP에 연결한다. 개인 데이터는 H2, 팀 데이터는 Oracle에 저장하고 로컬·서버 에이전트가 각각 실행한다. core와 MCP 토큰 자동 연결을 포함한 확정 구조이다.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#dbe4ed"/></pattern>
  <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#2373c7" stroke-width="1.7" stroke-linejoin="round"/></marker>
  <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#218574" stroke-width="1.7" stroke-linejoin="round"/></marker>
  <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#7c8fa3" stroke-width="1.7" stroke-linejoin="round"/></marker>
  <style>
    text{font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;fill:#203449} .title{font-size:30px;font-weight:800;letter-spacing:-1px}.subtitle{font-size:18px;fill:#61758b}.label{font-size:19px;font-weight:700}.body{font-size:18px;fill:#61758b}.small{font-size:16px;fill:#61758b}.mono{font-family:Consolas,monospace;font-size:25px;font-weight:700}.route{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.pc{stroke:#2373c7;marker-end:url(#blue)}.sv{stroke:#218574;marker-end:url(#green)}.db{stroke:#7c8fa3;marker-end:url(#gray)}.label-bg{fill:#f8fafc}.core{fill:#f5f0ff;stroke:#ac95ce;stroke-width:1.5;stroke-dasharray:6 5}.icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  </style>
</defs>
