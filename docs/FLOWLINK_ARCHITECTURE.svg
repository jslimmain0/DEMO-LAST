<text x="1312" y="85" font-size="16" style="fill:#d2deeb">계정 확인 · 중앙 서버에서 처리</text>
<path class="route sv" d="M1410 104V252"/>
<rect x="1430" y="111" width="166" height="29" rx="5" fill="#f8fafc"/><text x="1440" y="132" class="small">인증 결과</text>

