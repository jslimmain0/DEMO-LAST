<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1060" viewBox="0 0 1740 1060" role="img" aria-labelledby="title desc">
<title id="title">FlowLink 확정 소스 모듈 의존 관계</title><desc id="desc">desktop과 server가 공통 관리 로직을 가진 flow-core에 의존하고 core는 flow-agent를 사용한다. flow-mcp는 server만 로드하며 agent와 core는 독립 실행 프로세스가 아니다. desktop은 server 소스나 JAR에 의존하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8498ad" stroke-width="1.7" stroke-linejoin="round"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#dbe4ed"/></pattern><style>text{font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;fill:#203449}.mono{font-family:Consolas,monospace;font-size:32px;font-weight:700}.body{font-size:20px;fill:#61758b}.small{font-size:17px;fill:#61758b}.arrow{fill:none;stroke:#8498ad;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}</style></defs>
<rect width="1740" height="1060" fill="#f8fafc"/><rect width="1740" height="1060" fill="url(#grid)"/>
<text x="100" y="100" font-size="32" font-weight="800">두 실행 앱이 공통 코드를 사용한다.</text><text x="100" y="138" class="body">5개 소스 모듈 · 2개 실행 호스트 · 의존 화살표는 사용하는 쪽에서 출발</text>
<rect x="100" y="190" width="1540" height="235" rx="22" fill="white" stroke="#d4e0eb"/><text x="130" y="225" class="small">실행 호스트</text>
<rect x="225" y="258" width="480" height="130" rx="15" fill="#edf5ff" stroke="#8bb0d8" stroke-width="1.5"/><text x="260" y="305" class="mono" style="fill:#2373c7">flow-desktop</text><text x="260" y="340" class="body">개인 H2 · Windows · MCP 설정</text><text x="260" y="368" class="small">로그인 / MCP 토큰 관리 / 설치·업데이트</text>
<rect x="925" y="258" width="480" height="130" rx="15" fill="#eaf6f0" stroke="#80b7a7" stroke-width="1.5"/><text x="960" y="305" class="mono" style="fill:#218574">flow-server</text><text x="960" y="340" class="body">팀 Oracle · Vault · 중앙 인증</text><text x="960" y="368" class="small">MCP 토큰 발급 / 팀 API / PC 중계</text>
<path class="arrow" d="M465 388V470H695V524"/><path class="arrow" d="M1165 388V470H935V524"/>
<text x="473" y="501" class="small">공통 관리 코드 사용</text><text x="1000" y="501" class="small">공통 관리 코드 사용</text>
<rect x="555" y="535" width="520" height="148" rx="17" fill="#f4effc" stroke="#ac95ce" stroke-width="1.7" stroke-dasharray="8 6"/><text x="590" y="585" class="mono" style="fill:#75539e">flow-core</text><text x="590" y="620" class="body">워크플로 · 환경 · 실행 · 저장 관리</text><text x="590" y="651" class="small">공통 엔티티·JPA·서비스 구현의 실제 소유자</text><text x="1040" y="574" text-anchor="end" font-size="16" style="fill:#75539e">공통 코드</text>
<path class="arrow" d="M815 683V792"/><text x="832" y="745" class="small">실행 계약으로 호출</text>
<rect x="555" y="805" width="520" height="148" rx="17" fill="white" stroke="#adbdcf" stroke-width="1.5"/><text x="590" y="856" class="mono">flow-agent</text><text x="590" y="891" class="body">HTTP / TCP · Mock · 콜백 수신</text><text x="590" y="924" class="small">DB 없음 · PC / 서버 동일 구현</text>
<path class="arrow" d="M1405 323H1520V792"/><text x="1538" y="550" class="small">서버만</text><text x="1538" y="577" class="small">로드</text>
<rect x="1220" y="805" width="420" height="148" rx="17" fill="white" stroke="#80b7a7" stroke-width="1.5"/><text x="1255" y="856" class="mono" style="fill:#218574">flow-mcp</text><text x="1255" y="891" class="body">중앙 /mcp · Bearer 토큰 검증</text><text x="1255" y="924" class="small">관리 API로 연결 · 개인 DB 직접 접근 없음</text>
<text x="100" y="1010" class="small">호스트 의존: desktop → core ← server</text><text x="100" y="1038" class="small">공통 구현은 core에 있으며 desktop의 server 소스·JAR 의존은 없습니다.</text><text x="1640" y="1025" text-anchor="end" class="small">core / agent / mcp는 독립 프로세스가 아닙니다.</text>
</svg>
