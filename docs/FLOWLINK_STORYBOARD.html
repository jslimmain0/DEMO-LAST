<style>

node[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:3px}.node .number{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:7px}.node b{display:block;font-size:13px;line-height:1.4;margin-bottom:8px}.node code{font-size:10px;display:block;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node .pill{font-size:10px;padding:2px 6px}.cross-data{padding:12px 15px;border-top:1px solid var(--line);font-size:11px;line-height:1.8;background:white}.cross-data b{display:block}.inspector{border:1px solid var(--line);border-radius:var(--radius);padding:15px;background:white}.inspector header{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:13px}.inspector header b{font-size:14px}.field{margin-bottom:14px}.help{font-size:11px;line-height:1.7;margin:6px 0 0;color:var(--muted)}.notice{padding:11px 13px;border:1px solid #c3d8ef;background:var(--pcwash);border-radius:7px;font-size:12px;line-height:1.75}.notice.warn{color:#754113;border-color:#edd1b3;background:var(--warnwash)}.notice.server{color:#135d55;border-color:#c3e3db;background:var(--serverwash)}.section{margin-top:18px}.runbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px;font-size:12px}.runbar b{font-size:13px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:10px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding:10px 12px}td{padding:12px;border-bottom:1px solid #e8edf4;vertical-align:middle}td code{font-size:11px}.state{font-size:11px;font-weight:650}.state.ok{color:var(--server)}.state.wait{color:var(--warn)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:var(--radius);padding:19px;background:white}.card p{font-size:12px;color:var(--muted);margin-bottom:12px}.card .row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:9px 0;border-bottom:1px solid #e8edf4;font-size:12px}.card .row:last-child{border-bottom:0}.flow-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0;border-bottom:1px solid var(--line)}.flow-row b{font-size:14px}.flow-row p{font-size:11px;margin:4px 0 0;color:var(--muted)}.flow-row button{font-size:12px}.diagram{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;gap:10px;margin-top:18px}.diagram .box{border:1px solid var(--line);border-radius:9px;padding:17px;font-size:12px}.diagram .box.pc{border-color:#c6d5f0;background:var(--pcwash)}.diagram .box.server{border-color:#c4e1d9;background:var(--serverwash)}.diagram .arrow{display:grid;place-items:center;color:var(--muted);font-size:23px}.diagram strong{display:block;margin-bottom:9px}.diagram ul{padding-left:18px;margin-bottom:0}.caption{margin:14px 22px 22px;border-left:3px solid var(--ink);padding:9px 16px;color:var(--muted);font-size:12px;background:white}.caption b{color:var(--ink);display:block;margin-bottom:2px}.fault-layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:18px}.timeline{list-style:none;padding:0;margin:15px 0}.timeline li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.step-dot{width:27px;height:27px;flex-shrink:0;display:grid;place-items:center;background:var(--wash);border-radius:50%;font:600 12px Consolas}.timeline small{display:block;margin-top:4px}.timeline .good .step-dot{background:var(--serverwash);color:var(--server)}.timeline .pending .step-dot{background:var(--warnwash);color:var(--warn)}dialog{width:min(760px,calc(100vw - 32px));padding:0;color:var(--ink);background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 90px #15294230}dialog::backdrop{background:#15294265}dialog header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}dialog h2{font-size:18px;margin:0}dialog .dialog-body{padding:19px 22px}dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line)}.empty{padding:40px 22px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.metadata{font-size:11px;margin-top:12px;color:var(--muted)}.desktop-detail{margin-top:18px;font-size:12px}.desktop-detail summary{cursor:pointer;font-weight:700}.desktop-detail p{margin:8px 0 0;color:var(--muted)}
@media(min-width:1600px){.shell,.caption{max-width:1510px;margin-left:auto;margin-right:auto}.review{padding-left:max(26px,calc((100vw - 1510px)/2))}}@media(max-width:1150px){.editor,.fault-layout{grid-template-columns:1fr}.inspector{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}.inspector header,.inspector .notice{grid-column:1/-1}.main{padding:20px}.node{padding:11px}.agent-summary{gap:5px}.account{padding-left:8px}.app-header{padding:0 14px;gap:8px}.cards{gap:12px}}@media(max-width:780px){.shell{margin:10px 8px}.review{padding:15px}.review-head{align-items:flex-start}h1{font-size:19px}.app-header{height:auto;min-height:64px;flex-wrap:wrap;padding:12px}.agent-summary{margin-left:0}.account{margin-left:auto}.app-body{grid-template-columns:150px minmax(0,1fr)}.side{padding:10px 6px}.space{font-size:11px;padding:8px 6px}.main{padding:16px 12px}.title-row{display:block}.title-row .actions{margin-top:12px}.cards,.diagram{grid-template-columns:1fr}.diagram .arrow{transform:rotate(90deg);height:20px}.lanes{grid-template-columns:repeat(3,145px);width:500px}.canvas{overflow-x:auto}.inspector{display:block}.caption{margin:12px 8px}.review-badge{font-size:10px}.brand{font-size:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="review">
  <div class="review-head"><h1>FlowLink · 에이전트 실행 설계</h1><span class="review-badge">검토용 스토리보드 · 2026.10.03</span></div>
  <p class="muted">저장은 워크스페이스에, 실행은 노드에, 리슨은 Mock의 공간에. 아래 화면은 클릭 가능한 시뮬레이션입니다.</p>
  <nav aria-label="스토리보드 화면">
    <button data-scene="connection">1 연결·로그인</button><button data-scene="workspace">2 워크스페이스</button><button data-scene="editor">3 혼합 워크플로</button><button data-scene="mock">4 Mock 서버</button><button data-scene="failure">5 단절·복구</button>
  </nav>
</header>
<div class="shell">
  <header class="app-header"><div class="brand"><span class="brand-mark" aria-hidden="true">F</span>FlowLink</div><span class="muted" style="font-size:11px">연동 개발 워크스페이스</span><div id="agentSummary" class="agent-summary"></div><div id="account" class="account"></div></header>
  <div class="app-body"><aside id="sidebar" class="side" aria-label="워크스페이스"></aside><main id="main" class="main"></main></div>
</div>
<aside id="caption" class="caption" aria-label="화면 설계 설명"></aside>
<div id="announce" class="sr" role="status" aria-live="polite"></div>
<dialog id="planDialog" aria-labelledby="planTitle"><header><h2 id="planTitle">실행 계획 확인</h2><button data-action="close-plan" aria-label="실행 계획 닫기">닫기</button></header><div id="planContent" class="dialog-body"></div><footer><button data-action="close-plan">돌아가기</button><button class="primary" id="confirmRun" data-action="confirm-run">미리보기 실행</button></footer></dialog>
<dialog id="mockDialog" aria-labelledby="mockTitle"><header><h2 id="mockTitle">Mock 만들기</h2><button data-action="close-mock" aria-label="Mock 만들기 닫기">닫기</button></header><form id="mockForm"><div class="dialog-body"><div class="field"><label for="mockName">Mock 이름</label><input id="mockName" name="name" value="새 연동 Mock" required maxlength="80"></div><div class="field"><label for="mockSpace">저장 워크스페이스</label><select id="mockSpace" name="space"><option value="personal">개인 · 이 PC H2</option><option value="public">공용 · 서버 DB</option><option value="team">결제팀 · 서버 DB</option><option value="qa">QA팀 · 서버 DB</option></select></div><div class="field"><label for="mockType">통신 방식</label><select id="mockType" name="type"><option value="HTTP">HTTP</option><option value="TCP">TCP</option></select></div><div class="notice" id="mockPlacement"></div><p class="help">생성 후 시작을 눌러 리슨합니다. 개인 Mock을 서버에 자동 배포하지 않습니다.</p></div><footer><button type="button" data-action="close-mock">취소</button><button class="primary" type="submit">Mock 생성 미리보기</button></footer></form></dialog>
<script>
'use strict';
const spaces={personal:{name:'개인',owner:'이 PC · H2',kind:'pc',detail:'로그인과 관계없이 사용'},public:{name:'공용',owner:'개발서버 · 공용 DB',kind:'server',detail:'로그인한 조직 구성원'},team:{name:'결제팀',owner:'개발서버 · 팀 DB',kind:'server',detail:'팀 멤버 8명'},qa:{name:'QA팀',owner:'개발서버 · 팀 DB',kind:'server',detail:'팀 멤버 4명'}};
const nodes=[{name:'로컬 주문 조회',type:'GET',agent:'local',mock:'personal',output:'orderId · amount'},{name:'개발 결제 요청',type:'POST',agent:'server',mock:'team',output:'approvalId · status'},{name:'로컬 응답 검증',type:'ASSERT',agent:'local',mock:'none',output:'검증 결과'}];
const state={scene:'editor',space:'team',signed:true,online:true,selected:1,phase:0,pending:false,unknown:false};
const mocks=[{name:'주문 API',space:'personal',type:'HTTP',running:true,slug:'orders'},{name:'공통 회원 API',space:'public',type:'HTTP',running:true,slug:'users'},{name:'결제 게이트웨이',space:'team',type:'HTTP',running:true,slug:'gateway'},{name:'승인 전문',space:'team',type:'TCP',running:true,port:9102,slug:'approval'}];
const $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const local=agent=>agent==='local';
const agentName=agent=>local(agent)?'이 PC':'개발서버';
const pill=(agent,text)=>`<span class="pill ${local(agent)?'pc':'server'}"><span class="dot" aria-hidden="true"></span>${esc(text||agentName(agent))}</span>`;
const selectedSpace=()=>spaces[state.space];
const unavailable=()=>!state.signed||!state.online;
const mismatch=node=>node.mock!=='none'&&((node.mock==='personal')!==local(node.agent));
const blocked=()=>nodes.some(mismatch)||((nodes.some(n=>!local(n.agent))||state.space!=='personal')&&unavailable());
function announce(message){$('announce').textContent=message;}
function requestUrl(node){if(node.type==='ASSERT')return '{{ status@pay }} == "approved"';if(node.mock==='personal')return 'http://127.0.0.1:18180/mock/orders/order/42';if(node.mock==='team')return 'https://flowlink.dev.example/mock/payments/gateway/pay';return 'http://127.0.0.1:9081/payments';}
function endpoint(mock){if(mock.type==='TCP')return mock.space==='personal'?`127.0.0.1:${mock.port||9510}`:`dev-agent.internal:${mock.port||9103}`;return mock.space==='personal'?`http://127.0.0.1:18180/mock/${mock.slug}/**`:`https://flowlink.dev.example/mock/${mock.space==='team'?'payments':mock.space}/${mock.slug}/**`;}
function nextPort(space){return Math.max(space==='personal'?9509:9101,...mocks.filter(m=>m.type==='TCP'&&((m.space==='personal')===(space==='personal'))).map(m=>m.port))+1;}
function title(name,description,actions=''){return `<div class="title-row"><div><div class="eyebrow">${esc(selectedSpace().name)} / ${esc(selectedSpace().owner)}</div><h2>${name}</h2><p>${description}</p></div><div class="actions">${actions}</div></div>`;}
function owner(note='실행 에이전트는 각 노드에서 선택'){return `<div class="owner"><b>저장 공간: ${esc(selectedSpace().name)}</b><span>${esc(selectedSpace().owner)}</span><span>${esc(note)}</span></div>`;}
function renderShell(){
 $('agentSummary').innerHTML=pill('local','PC 에이전트 · 연결됨')+(unavailable()?'<span class="pill warn"><span class="dot" aria-hidden="true"></span>서버 · '+(state.signed?'연결 끊김':'로그인 필요')+'</span>':pill('server','서버 에이전트 · 연결됨'));
 $('account').innerHTML=state.signed?'김개발 <button class="text" data-action="logout">로그아웃</button>':'<button data-action="login">Windows 앱 로그인</button>';
 $('sidebar').innerHTML=`<div class="side-label">개인 공간</div>${spaceButton('personal')}<div class="side-label">사내 서버 ${state.signed?'':'· 로그인 필요'}</div>${['public','team','qa'].map(spaceButton).join('')}<button class="text" style="font-size:11px;text-align:left;margin:8px" data-action="new-team" ${unavailable()?'disabled':''}>＋ 팀 워크스페이스</button><div class="side-label">작업</div><button class="space" data-scene="editor">◇ 혼합 워크플로</button><button class="space" data-scene="mock">◈ Mock 서버</button><div class="side-footer">개인: PC의 H2<br>공용·팀: 서버 DB${state.pending?'<div class="state wait">서버 흐름 · 연결 대기 중</div>':''}<button data-scene="connection">에이전트·연결 설정</button></div>`;
 document.querySelectorAll('.review [data-scene]').forEach(button=>{if(button.dataset.scene===state.scene)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});
}
function spaceButton(id){const space=spaces[id];return `<button class="space ${space.kind==='server'?'server-space':''}" data-space="${id}" aria-current="${state.space===id}"><span class="space-icon" aria-hidden="true">${id==='personal'?'▣':id==='public'?'◎':'▤'}</span><span>${space.name}<small>${space.owner}</small></span></button>`;}
function render(){renderShell();$('main').innerHTML=({editor:editorView,workspace:workspaceView,mock:mockView,failure:failureView,connection:connectionView}[state.scene])();$('caption').innerHTML=captions[state.scene];}

function runLog(){const started=state.phase>0;const complete=state.phase>3;const active=state.phase-1;return `<section class="section" aria-label="실행 미리보기"><div class="runbar"><b>실행 ${started?'RUN-2048':'미리보기'} ${complete?'· 성공':started?'· 진행 중':''}</b>${started&&!complete?'<button data-action="next" style="font-size:11px">다음 노드 결과 보기</button>':'<span class="muted">브라우저를 닫아도 앱이 진행</span>'}</div><table><thead><tr><th>노드</th><th>실행 에이전트</th><th>상태</th><th>결과</th></tr></thead><tbody>${nodes.map((n,i)=>`<tr><td>0${i+1} ${n.name}</td><td>${pill(n.agent)}</td><td class="state ${complete||i<active?'ok':i===active&&started?'wait':''}">${complete||i<active?'✓ 성공':started&&i===active?'실행 중':'실행 대기'}</td><td><code>${complete||i<active?i===0?'orderId: 42, amount: 12000':i===1?'approvalId: AP-820, status: approved':'검증 통과':'—'}</code></td></tr>`).join('')}</tbody></table></section>`;}
function workspaceView(){const remote=state.space!=='personal';return title(`${selectedSpace().name} 워크스페이스`,remote?'서버에 저장하고, 실행 에이전트는 각 노드에서 정합니다.':'서버에 로그인해도 이 PC의 개인 저장소를 그대로 사용합니다.',`<button data-action="transfer">선택하여 공유</button><button class="primary" data-action="open-editor">워크플로 열기</button>`)+owner()+(remote&&unavailable()?`<div class="notice warn">${state.signed?'서버 연결이 끊겼습니다.':'서버 로그인이 필요합니다.'} 개인 공간은 계속 사용할 수 있습니다. 서버 자료를 개인 DB로 자동 복사하지 않습니다.</div>`:`<div class="cards"><section class="card"><h3>이 공간의 데이터</h3><div class="row"><span>워크플로 · 버전 · 이력</span><b>${remote?'서버 DB':'개인 H2'}</b></div><div class="row"><span>환경 · 시크릿</span><b>${remote?'해당 서버 공간':'이 PC'}</b></div><div class="row"><span>Mock · 콜백 수신</span>${pill(remote?'server':'local')}</div></section><section class="card"><h3>실행 에이전트</h3><p>저장 위치와 별도로 노드마다 선택합니다.</p><div class="row"><span>이 PC에서 테스트</span>${pill('local','선택 가능')}</div><div class="row"><span>개발서버에서 호출</span>${unavailable()?'<span class="pill warn">로그인 후 선택</span>':pill('server','선택 가능')}</div><div class="row"><span>혼합 실행</span><b>PC → 서버 → PC</b></div></section></div><section class="section"><div class="runbar"><b>워크플로</b><span class="muted">실행 위치는 노드에 표시</span></div><div class="flow-row"><div><b>주문 조회 · 결제 · 응답 검증</b><p>저장: ${selectedSpace().owner} · 실행: PC 2개 / 서버 1개</p></div><button data-action="open-editor">편집</button></div></section>`)+`<div class="notice section">개인 공간과 서버 공간은 같은 목록에 함께 표시됩니다. 로그인·로그아웃은 서버 접근만 변경합니다.</div>`;}
function mockView(){const visible=mocks.filter(m=>m.space===state.space);return title('Mock 서버','저장 공간이 리슨 에이전트를 결정합니다.',`<button class="primary" data-action="new-mock">＋ Mock 만들기</button>`)+owner('리슨 위치는 이 공간의 에이전트로 고정')+`<div class="notice ${state.space==='personal'?'':'server'}"><b>${selectedSpace().name}</b>에 만든 Mock은 <b>${state.space==='personal'?'이 PC':'서버 에이전트'}</b>가 리슨합니다. 다른 공간의 Mock은 왼쪽에서 선택할 수 있습니다.</div><div class="table-wrap section"><table><thead><tr><th>Mock</th><th>리스닝 에이전트</th><th>접속 주소</th><th>실제 상태</th><th>동작</th></tr></thead><tbody>${visible.map(m=>`<tr><td><b>${esc(m.name)}</b><br><small>${m.type} · ${spaces[m.space].name}</small></td><td>${pill(m.space==='personal'?'local':'server')}</td><td><code>${esc(endpoint(m))}</code></td><td class="state ${m.space!=='personal'&&unavailable()?'wait':m.running?'ok':''}">${m.space!=='personal'&&unavailable()?'상태 확인 불가':m.running?'● 리슨 중':'■ 중지됨'}</td><td><button data-toggle-mock="${mocks.indexOf(m)}" ${m.space!=='personal'&&unavailable()?'disabled':''}>${m.running?'중지':'시작'}</button></td></tr>`).join('')}</tbody></table></div>${!visible.length?'<div class="empty">이 공간에 Mock을 만들어 리슨할 주소를 정하세요.</div>':''}<section class="cards section"><div class="card"><h3>개인 Mock</h3><p>PC의 H2에 저장하고 PC 에이전트가 소켓을 엽니다.</p><code>HTTP 127.0.0.1:18180<br>TCP 127.0.0.1:9510</code><p class="help">기본 바인딩은 PC loopback입니다.</p></div><div class="card"><h3>공용·팀 Mock</h3><p>서버 DB에 저장하고 서버 에이전트가 소켓을 엽니다.</p><code>HTTP 서버 HTTPS 진입점<br>TCP 서버가 할당한 포트</code><p class="help">표시 주소·Docker 포트·방화벽 설정을 함께 관리합니다.</p></div></section><p class="metadata">개인 Mock을 서버 노드에서 선택하면 접근 가능 여부를 실행 전에 확인합니다. 저장을 리슨 성공으로 표시하지 않습니다.</p>`;}

function connectionView(){return title('에이전트·서버 연결','앱이 로그인과 작업 라우팅을 담당합니다.',`<button data-action="${state.signed?'logout':'login'}">${state.signed?'서버 로그아웃':'Windows 앱 로그인 미리보기'}</button>`)+`<div class="cards"><section class="card"><h3>이 PC 에이전트</h3>${pill('local','연결됨 · 개발자 PC')}<div class="row"><span>개인 저장소</span><b>H2 · 이 Windows 사용자</b></div><div class="row"><span>역할</span><b>노드 선택 · 호출 · 결과 전달</b></div><div class="row"><span>처리</span><b>HTTP · TCP · 변환 · Mock</b></div><p class="help">네이티브 MSI에 런타임을 포함합니다. PC에 Docker를 설치하지 않습니다.</p></section><section class="card"><h3>사내 서버 에이전트</h3>${unavailable()?'<span class="pill warn">'+(state.signed?'연결 끊김':'로그인 필요')+'</span>':pill('server','연결됨 · 개발서버')}<div class="row"><span>서버</span><code>https://flowlink.dev.example</code></div><div class="row"><span>저장소</span><b>공용·팀 DB</b></div><div class="row"><span>로그인</span><b>${state.signed?'김개발 · 앱 세션':'Windows 앱에서 로그인'}</b></div><p class="help">다운로드한 설치본의 배포 정보로 서버·MCP 주소를 자동 설정합니다.</p></section></div><div class="diagram"><div class="box pc"><strong>PC 앱의 Dispatcher</strong><div>브라우저 / 트레이 / IDE MCP</div><ul><li>실행할 노드·에이전트를 선택</li><li>PC 노드는 로컬 Executor 호출</li><li>개인 정의·상태는 H2에 저장</li><li>브라우저 없이 백그라운드 진행</li></ul></div><div class="arrow" aria-label="PC에서 서버로 HTTPS 연결">⇄</div><div class="box server"><strong>서버 Backend + Executor</strong><div>인증된 HTTPS 작업 조회·실행·결과 제출</div><ul><li>공용·팀 정의와 진행 상태 원본</li><li>서버 노드를 서버에서 실행</li><li>공용·팀 Mock · 콜백 수신 리슨</li><li>PC로 직접 인바운드 접속하지 않음</li></ul></div></div><details class="desktop-detail"><summary>IDE MCP 연결 동선</summary><p>트레이 → MCP 연결 → VS Code 등록 또는 IntelliJ 설정 복사. 개인·서버 작업은 같은 앱 Dispatcher와 로그인 세션을 사용합니다. MCP 테스트는 이 검토 범위에서 제외합니다.</p></details>`;}
function showPlan(){const bad=blocked();$('planContent').innerHTML=`<div class="owner"><b>저장: ${selectedSpace().name}</b><span>상태·이력: ${selectedSpace().owner}</span></div><table><thead><tr><th>순서</th><th>노드</th><th>출발지</th><th>환경</th><th>확인</th></tr></thead><tbody>${nodes.map((n,i)=>`<tr><td>0${i+1}</td><td>${n.name}</td><td>${pill(n.agent)}</td><td>${local(n.agent)?'PC 로컬 테스트':'서버 개발'}</td><td class="state ${mismatch(n)||(!local(n.agent)&&unavailable())?'wait':'ok'}">${mismatch(n)?'Mock 위치 불일치':!local(n.agent)&&unavailable()?'서버 연결 필요':'준비됨'}</td></tr>`).join('')}</tbody></table><div class="notice section">전달 필드: <code>orderId · amount → 서버 / approvalId · status → PC</code><br>시크릿은 실행할 에이전트에서 해석합니다. 개인 정의·시크릿 저장소 전체를 보내지 않습니다.</div>${bad?'<div class="notice warn section" role="alert">에이전트·Mock 위치 또는 서버 연결을 먼저 확인하세요. 실행 위치를 자동으로 바꾸지 않습니다.</div>':''}<p class="metadata">미리보기는 예시 결과만 표시합니다. 실제 외부 API를 호출하지 않습니다.</p>`;$('confirmRun').disabled=bad;$('planDialog').showModal();}
function startRun(){state.phase=1;state.pending=false;state.unknown=false;render();announce('노드 01을 PC 에이전트에서 실행하는 미리보기입니다.');}
function updateMockPlacement(){const space=$('mockSpace').value;$('mockForm').querySelector('button[type=submit]').disabled=space!=='personal'&&unavailable();const tcp=$('mockType').value==='TCP';$('mockPlacement').innerHTML=`<b>리슨: ${space==='personal'?'이 PC · 로컬 에이전트':'개발서버 · 서버 에이전트'}</b><br>정의 저장: ${space==='personal'?'개인 H2':'서버 DB'}<br>주소: <code>${space==='personal'?(tcp?`127.0.0.1:${nextPort(space)}`:'127.0.0.1:18180/mock/...'):(tcp?'dev-agent.internal:서버 할당 포트':'서버 HTTPS /mock/공간/...')}</code>`;}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button||button.disabled)return;
 if(button.dataset.scene){state.scene=button.dataset.scene;if(state.scene==='failure'){state.space='team';state.pending=true;state.online=false;}render();return;}
 if(button.dataset.space){state.space=button.dataset.space;if(state.scene!=='mock')state.scene='workspace';render();announce(`${selectedSpace().name} 공간을 선택했습니다.`);return;}
 if(button.dataset.node!==undefined){state.selected=Number(button.dataset.node);render();return;}
 if(button.dataset.toggleMock!==undefined){const mock=mocks[Number(button.dataset.toggleMock)];mock.running=!mock.running;render();announce(`${mock.name} ${mock.running?'리스닝 시작':'중지'} 미리보기`);return;}
 switch(button.dataset.action){
  case 'logout':state.signed=false;state.online=false;state.space='personal';state.scene='workspace';render();announce('서버 세션을 종료했습니다. 개인 공간은 계속 사용할 수 있습니다.');break;
  case 'login':state.signed=true;state.online=true;render();announce('모킹 로그인 완료. 개인 공간과 서버 공간을 함께 표시합니다.');break;
  case 'open-editor':state.scene='editor';render();break;
  case 'plan':case 'run':showPlan();break;
  case 'close-plan':$('planDialog').close();break;
  case 'confirm-run':$('planDialog').close();startRun();break;
  case 'next':if(state.phase===2&&unavailable()){state.pending=true;state.scene='failure';}else state.phase=Math.min(4,state.phase+1);render();break;
  case 'match-agent':nodes[state.selected].agent=nodes[state.selected].mock==='personal'?'local':'server';state.phase=0;render();break;
  case 'new-mock':$('mockSpace').value=state.space;$('mockDialog').showModal();updateMockPlacement();break;
  case 'close-mock':$('mockDialog').close();break;
  case 'disconnect':state.online=false;state.pending=true;state.unknown=false;state.scene='failure';render();break;
  case 'reconnect':state.online=true;state.signed=true;state.pending=false;render();announce(state.unknown?'서버 연결은 복구했습니다. 외부 처리 결과를 먼저 확인해야 합니다.':'서버 연결을 복구했습니다. 같은 실행의 결과를 확인합니다.');break;
  case 'personal':state.space='personal';state.scene='workspace';render();break;
  case 'unknown':state.unknown=true;state.pending=true;render();break;
  case 'transfer':announce('선택한 정의만 명시적으로 공유합니다. 환경·시크릿 원문·실행 이력은 기본 공유 대상에서 제외합니다.');$('caption').innerHTML='<b>공유는 사용자가 선택한 복사입니다.</b>워크플로·Mock·전문 의존성을 확인하고 목적지 공간을 지정합니다. 개인 시크릿·전체 실행 이력·로그인 토큰을 자동 업로드하지 않습니다.';break;
  case 'new-team':state.space='qa';state.scene='workspace';render();announce('팀 공간은 서버 DB에서 생성하는 동선입니다.');break;
 }
});
document.addEventListener('change',event=>{if(event.target.id==='nodeAgent'){nodes[state.selected].agent=event.target.value;state.phase=0;render();}else if(event.target.id==='nodeMock'){nodes[state.selected].mock=event.target.value;state.phase=0;render();}else if(event.target.id==='mockSpace'||event.target.id==='mockType')updateMockPlacement();});
$('mockForm').addEventListener('submit',event=>{event.preventDefault();const space=$('mockSpace').value;if(space!=='personal'&&unavailable()){announce('서버에 로그인하고 연결한 뒤 Mock을 생성하세요.');return;}mocks.push({name:$('mockName').value.trim()||'새 Mock',space,type:$('mockType').value,running:false,slug:'new-mock-'+mocks.length,port:nextPort(space)});state.space=space;state.scene='mock';$('mockDialog').close();render();announce('Mock 정의를 만들었습니다. 아직 리슨하지 않습니다.');});
render();
</script>
</body>
</html>
