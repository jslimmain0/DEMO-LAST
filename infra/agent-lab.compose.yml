# 로컬 PC와 함께 직접 사용하는 GitHub 인증 서버. 검증용이며 운영 배포와 분리한다.
name: flowlink-agent-lab
services:
  server:
    image: flowlink-agent-test
    build:
      context: ..
      dockerfile: infra/agent-test.Dockerfile
    ports:
      - "127.0.0.1:18080:18080"
      - "127.0.0.1:18090:18090"
      - "127.0.0.1:9091-9190:9091-9190"
    env_file: ../.run/agent-lab/secrets.env
    environment:
      SPRING_PROFILES_ACTIVE: local,agent-lab
      FLOWLINK_AUTH_GITHUB_ENABLED: "true"
      FLOWLINK_AUTH_GUEST_ENABLED: "false"
      FLOWLINK_MCP_PORT: "18090"
      FLOWLINK_H2_FILE: /home/gradle/agent-lab/db/flowlink
      FLOWLINK_PLUGINS_DIR: /home/gradle/agent-lab/plugins
      SPRING_H2_CONSOLE_ENABLED: "false"
      FLOWLINK_PUBLIC_URL: http://127.0.0.1:18080
      FLOWLINK_PUBLIC_MCP_URL: http://127.0.0.1:18090/mcp
      FLOWLINK_DISTRIBUTION_DIR: /app/downloads
      FLOWLINK_MOCK_TCP_PORT_START: "9091"
      FLOWLINK_MOCK_TCP_PORT_END: "9190"
      FLOWLINK_MOCK_TCP_ADVERTISED_HOST: "127.0.0.1"
    volumes:
      - server-data:/home/gradle
      - ../.run/agent-lab/downloads:/app/downloads:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18080/api/v1/auth/config"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
    stop_grace_period: 30s

  mcp:
    image: flowlink-agent-test
    entrypoint: ["node", "--use-system-ca", "/app/mcp/src/index.js"]
    network_mode: service:server
    environment:
      FLOWLINK_URL: http://127.0.0.1:18080
      FLOWLINK_MCP_PORT: "18090"
    volumes:
      - server-data:/home/gradle
    depends_on:
      server:
        condition: service_healthy

volumes:
  server-data:
