name: flowlink-runtime
services:
  server:
    image: ${FLOWLINK_IMAGE:?Release image required}
    env_file: ${FLOWLINK_CONFIG_FILE:?Server configuration required}
    environment:
      FLOWLINK_PORT: "18080"
      FLOWLINK_DISTRIBUTION_DIR: /app/downloads
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - server-data:/home/flowlink
      - ${FLOWLINK_DOWNLOAD_DIR:?Download directory required}:/app/downloads:ro
    expose: ["18080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18080/api/v1/auth/config"]
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 24
    stop_grace_period: 45s
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      FLOWLINK_SITE_ADDRESS: ${FLOWLINK_SITE_ADDRESS:?Domain or lab HTTP address required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  server-data:
  proxy-data:
  proxy-config:
