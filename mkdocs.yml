# FlowLink 문서 사이트 (GitHub Pages) — docs/ 의 md 를 그대로 빌드한다.
#   로컬 미리보기: pip install mkdocs-material && mkdocs serve
#   배포: .github/workflows/docs.yml 이 main 푸시 시 자동 배포
site_name: FlowLink
site_description: REST API 워크플로 오케스트레이션 플랫폼 — 사용·운영 문서
site_url: https://jslimmain0.github.io/DEMO-LAST/
repo_url: https://github.com/jslimmain0/DEMO-LAST
repo_name: jslimmain0/DEMO-LAST
edit_uri: edit/main/docs/

docs_dir: docs
# 내부 설계 스펙/계획(superpowers)은 사이트에서 제외 — 저장소에서만 열람
exclude_docs: |
  superpowers/

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: 다크 모드 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: 라이트 모드 }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      # 한글 헤딩 앵커 유지(GitHub 와 동일한 유니코드 슬러그) — 기본 slugify 는 비ASCII 를 버린다
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 홈: index.md
  - 심플가이드: guide/심플가이드.md
  - 심화가이드:
      - 목차: guide/README.md
      - 01. 시작하기: guide/01-시작하기.md
      - 02. 에디터: guide/02-에디터.md
      - 03. 노드 레퍼런스: guide/03-노드-레퍼런스.md
      - 04. 토큰 바인딩: guide/04-토큰-바인딩.md
      - 05. 실행과 디버깅: guide/05-실행-디버깅.md
      - 06. 환경·시크릿·실행 입력: guide/06-환경-시크릿-입력.md
      - 07. 트리거 자동화: guide/07-트리거-자동화.md
      - 08. 실행 이력·재실행·스위트: guide/08-실행이력-스위트.md
      - 09. 버전 관리와 협업: guide/09-버전-협업.md
      - 10. Mock 서버: guide/10-Mock-서버.md
      - 11. 가져오기/내보내기: guide/11-가져오기-내보내기.md
      - 12. AI 어시스턴트: guide/12-AI-어시스턴트.md
      - 13. FAQ·문제 해결: guide/13-FAQ-문제해결.md
      - 14. 편의 기능 모음: guide/14-편의기능.md
      - 15. 폼·콜백 연동 심층: guide/15-폼-콜백-연동.md
  - 사용가이드 (요약본): 사용가이드.md
  - 운영자 가이드: 운영가이드.md
