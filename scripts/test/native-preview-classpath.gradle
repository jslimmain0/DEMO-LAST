// 기존 root task 호출 계약 유지: -I ... nativeUpdatePreviewClasspath
// desktop test classpath에는 server plain JAR와 agent 프로젝트 의존성이 포함된다.
gradle.projectsEvaluated {
    def desktop = rootProject.project(':flow-desktop')
    rootProject.tasks.register('nativeUpdatePreviewClasspath') {
        dependsOn desktop.tasks.named('testClasses'), rootProject.project(':flow-server').tasks.named('classes'), rootProject.project(':flow-agent').tasks.named('classes')
        doLast {
            new File(rootProject.projectDir.parentFile, '.run/native-update-classpath.txt').text = desktop.sourceSets.test.runtimeClasspath.asPath
        }
    }
}
